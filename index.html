<style>
/* Layout: Nachtpetrol-Seitenleiste links, Arbeitsfläche auf Sand; Kupfer nur als Markierung */
:root{
  --bg:#f3f0eb; --surface:#ffffff; --surface-2:#ebe6de; --ink:#2e3a3f; --ink-2:#56656b; --line:#dcd5ca;
  --brand:#0f2b36; --brand-ink:#f3f0eb; --brand-ink-2:#a9c4c0; --primary:#1f5f6b; --on-primary:#ffffff;
  --accent:#c8743b; --sage:#8fb8b3; --sage-tint:#e2ecea;
  --good:#2f7a58; --warn:#a76a12; --crit:#b23f36; --good-t:#e1f0e8; --warn-t:#f6ead6; --crit-t:#f6e1de;
  --font:"Aptos","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1b21; --surface:#132a33; --surface-2:#1a3540; --ink:#e6ecec; --ink-2:#9db0b4; --line:#26444f;
  --brand:#08161b; --brand-ink:#e6ecec; --brand-ink-2:#8fb8b3; --primary:#8fb8b3; --on-primary:#0d1b21;
  --accent:#dc8b55; --sage:#8fb8b3; --sage-tint:#1d3d45;
  --good:#6cc49a; --warn:#e2a54a; --crit:#ec7d72; --good-t:#173a2c; --warn-t:#3b2d14; --crit-t:#3e1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1b21; --surface:#132a33; --surface-2:#1a3540; --ink:#e6ecec; --ink-2:#9db0b4; --line:#26444f;
  --brand:#08161b; --brand-ink:#e6ecec; --brand-ink-2:#8fb8b3; --primary:#8fb8b3; --on-primary:#0d1b21;
  --accent:#dc8b55; --sage:#8fb8b3; --sage-tint:#1d3d45;
  --good:#6cc49a; --warn:#e2a54a; --crit:#ec7d72; --good-t:#173a2c; --warn-t:#3b2d14; --crit-t:#3e1f1c; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
.side{background:var(--brand);color:var(--brand-ink);padding:20px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.wm{font-weight:600;font-size:22px;letter-spacing:-.01em;padding:0 10px;color:var(--brand-ink)}
.wm-i{position:relative;display:inline-block}
.wm-i i{position:absolute;left:50%;top:.13em;width:.21em;height:.21em;border-radius:50%;background:#c8743b;transform:translateX(-50%)}
.wm small{display:block;font-size:11px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-ink-2);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-ink-2);padding:12px 10px 4px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;color:var(--brand-ink);border-left:3px solid transparent}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.09);border-left-color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav .n{font-size:11.5px;color:var(--brand-ink-2);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--brand-ink-2);padding:0 10px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:20px;margin:0;font-weight:600;flex:1 1 auto;text-wrap:balance}
.search{flex:0 1 280px;min-width:160px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
#view{padding:24px 28px 64px;display:flex;flex-direction:column;gap:20px;min-width:0}
.btn{cursor:pointer;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);padding:8px 14px;border-radius:var(--r);font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.danger{border-color:var(--crit);background:transparent;color:var(--crit)}
.btn.danger.arm{background:var(--crit);color:#fff}
.btn:focus-visible,.icon-btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.icon-btn{cursor:pointer;border:0;background:transparent;color:var(--ink-2);font-size:18px;line-height:1;padding:2px 6px;border-radius:4px}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.banner{padding:12px 16px;border-radius:var(--r);background:var(--warn-t);color:var(--ink);border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.card h3{font-size:14px;margin:0;font-weight:600}
.cnt{font-weight:400;color:var(--ink-2);font-size:12.5px;margin-left:4px}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.mini li:first-child{border-top:0}
.mini li:hover .t{color:var(--primary);text-decoration:underline}
.mini .t{min-width:0;overflow-wrap:anywhere}
.mini .m{color:var(--ink-2);font-size:12.5px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.empty-s{color:var(--ink-2);margin:4px 0;font-size:13px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--sage-tint)}
.r{text-align:right!important}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip.good{background:var(--good-t);color:var(--good)}
.chip.warn{background:var(--warn-t);color:var(--warn)}
.chip.crit{background:var(--crit-t);color:var(--crit)}
.chip.info{background:var(--sage-tint);color:var(--primary)}
.tag-ex{display:inline-block;margin-left:6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;vertical-align:1px}
.muted{color:var(--ink-2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .sp{flex:1}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px}
.filters button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.kcol.over{outline:2px dashed var(--accent)}
.kcol h4{margin:0;font-size:13px;display:flex;justify-content:space-between}
.kcol h4 span{font-weight:400;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.kcard:hover{border-color:var(--primary)}
.kcard .ti{font-weight:600}
.kcard .meta{font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;gap:6px;align-items:center}
.kcard .mv{display:flex;gap:2px}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between}
.head h2{margin:0;font-size:22px;font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink-2);font-size:13px;margin-top:6px}
.facts a{color:var(--primary)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.timeline li:first-child{border-top:0}
.timeline .d{color:var(--ink-2);font-size:12.5px;font-variant-numeric:tabular-nums}
.timeline .x{white-space:pre-wrap;overflow-wrap:anywhere}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--primary)}
.bar i.over{background:var(--crit)}
.quick{display:grid;grid-template-columns:140px minmax(160px,1.2fr) 90px minmax(160px,2fr) auto;gap:8px;align-items:end}
.quick label{font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=url],select,textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
textarea{resize:vertical}
.modal{position:fixed;inset:0;background:rgba(8,22,27,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.dlg{background:var(--surface);border-radius:12px;width:100%;max-width:780px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column}
.dlg.wide{max-width:900px}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:8px}
.dlg-h h2{margin:0;font-size:17px}
.dlg-b{padding:18px 20px}
.dlg-f{display:flex;flex-direction:column;gap:12px;padding:12px 20px 14px;border-top:1px solid var(--line)}
.mainrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mainrow .sp{flex:1}
.acts summary{cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);list-style:none;display:inline-flex;align-items:center;gap:6px}
.acts summary::-webkit-details-marker{display:none}
.acts summary::after{content:'▾';font-size:11px;transition:transform .15s}
.acts:not([open]) summary::after{transform:rotate(-90deg)}
.acts-in{display:flex;flex-wrap:wrap;gap:10px 28px;padding-top:10px}
.ag{display:flex;flex-direction:column;gap:5px;min-width:0}
.agl{font-size:11px;color:var(--ink-2)}
.agb{display:flex;gap:6px;flex-wrap:wrap}
.agb .btn{padding:6px 11px;font-size:13px;font-weight:500;text-decoration:none}
.dlg-f .sp{flex:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;grid-column:span 2;min-width:0}
.fld.half{grid-column:span 1}
.fld label,.fld .lb{font-size:12.5px;color:var(--ink-2);font-weight:600}
.fld.check label{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--ink);padding-top:22px}
.fld.check input{width:auto}
.pos{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.postab{width:100%;border-collapse:collapse;min-width:620px}
.postab th{font-size:11.5px;color:var(--ink-2);text-align:left;padding:6px 6px;background:var(--surface-2)}
.postab td{padding:4px 6px;vertical-align:top;border-top:1px solid var(--line)}
.postab td:nth-child(2),.postab td:nth-child(4){width:96px}
.postab td:nth-child(3){width:104px}
.postab .p-sum{width:110px;padding-top:11px;font-variant-numeric:tabular-nums}
.posfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;flex-wrap:wrap;font-size:13px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:var(--r);z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.doc-wrap{background:var(--surface-2);padding:16px;border-radius:var(--r);overflow-x:auto}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.tabbar{display:none}
#ask{z-index:55;align-items:center}
#ask .dlg{max-width:520px}
.vers{margin:0 0 14px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.vers h3{margin:0 0 6px;font-size:13px}
.vers li[aria-current="true"] .t{font-weight:600}
.lockinfo{margin:0 0 14px}
.setup{max-width:520px;margin:0 auto;text-align:left}
.setup .form{margin:12px 0 16px}
@media (max-width:820px){
  body{-webkit-text-size-adjust:100%}
  .app{grid-template-columns:1fr;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .side{display:none}
  body.nav-open .side{display:flex;position:fixed;inset:0;z-index:40;height:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(80px + env(safe-area-inset-bottom,0px));overflow-y:auto}
  .nav button{padding:12px 10px;font-size:16px}
  .top{position:sticky;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;gap:8px}
  .top h1{font-size:18px;flex:1 1 60%}
  .search{flex:1 1 100%;order:3;font-size:16px}

const NAV = [

const projStd = p => S.zeiten.filter(z=>z.projektId===p.id).reduce((a,z)=>a+(Number(z.stunden)||0),0);
const projTage = p => projStd(p)/STD();

/* ---------- rendering ---------- */
let rq = false, pending = false;
function schedule(){ if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; const a = document.activeElement; if (a && $('#view').contains(a) && a.matches('input,select,textarea') && a.type!=='checkbox') { pending = true; return; } render(); }); }
$('#view').addEventListener('focusout', () => { if (pending) setTimeout(() => { const a=document.activeElement; if (!(a && $('#view').contains(a) && a.matches('input,select,textarea'))) { pending=false; render(); } }, 0); });

function renderNav(){

  }).join('');

  $('#sidefoot').textContent = state==='live' ? `${total} Datensätze · ${store.label} · ${dirty ? 'speichert …' : savedAt ? 'gespeichert ' + savedAt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) : 'geladen'}` : 'Kein Datenspeicher verbunden';
  const TABS = [['dashboard','Übersicht','<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],['pipeline','Pipeline','<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/>'],['zeiten','Zeiten','<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],['firmen','Firmen','<path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M8 8h3M8 12h3M8 16h3M3 21h18"/>'],['__more','Mehr','<path d="M4 7h16M4 12h16M4 17h16"/>']];
  const inTabs = TABS.some(t => t[0]===view);
  $('#tabbar').innerHTML = TABS.map(([k,l,ic]) => `<button data-act="${k==='__more'?'more':'nav'}" data-view="${k}"${(document.body.classList.contains('nav-open') ? k==='__more' : (k===view || (k==='__more' && !inTabs)))?' aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg><span>${l}</span></button>`).join('');

function render(){
  renderNav();
  const q = $('#q').value.trim().toLowerCase();
  let title = 'Übersicht', act = '', html = '';
  if (dbError) html += `<div class="banner">${esc(dbError)}${state==='live'?' <button class="btn sm" data-act="reload">Neu laden</button>':''}</div>`;
  if (state==='setup') html += setupView();
  else if (state==='signin') html += `<div class="empty"><b>Bei Microsoft 365 anmelden</b><p style="max-width:52ch;margin:8px auto 16px">Die App liest und speichert deine Daten direkt in deinem OneDrive (${esc(msCfg().path)}). Es werden keine Daten bei Dritten gespeichert.</p><button class="btn" data-act="ms-login">Mit Microsoft anmelden</button> <button class="btn ghost" data-act="ms-setup">Einstellungen</button></div>`;
  else if (state==='unsupported') html += `<div class="empty"><b>Dieser Browser kann nicht auf Ordner zugreifen.</b>Öffne die Datei „wendekreis-ERP.html“ aus deinem OneDrive-Ordner in Microsoft Edge oder Google Chrome.</div>`;
  else if (state==='nofolder') html += `<div class="empty"><b>Wähle den Ordner, in dem deine Daten liegen sollen.</b><p style="max-width:56ch;margin:8px auto 16px">Wähle den Ordner „wendekreis-ERP“ in deinem OneDrive. Dort legt die App die Datei „${FILE}“ an, dazu tägliche Sicherungen im Unterordner „Sicherungen“. Die Daten verlassen deinen Rechner nur über die OneDrive-Synchronisierung.</p><button class="btn" data-act="pick">Datenordner wählen</button></div>`;
  else if (state==='permission') html += `<div class="empty"><b>Zugriff auf „${esc(dir&&dir.name)}“ erlauben</b><p style="max-width:56ch;margin:8px auto 16px">Der Browser fragt nach jedem Neustart einmal nach, ob die App den Datenordner bearbeiten darf.</p><button class="btn" data-act="grant">Zugriff erlauben</button> <button class="btn ghost" data-act="pick">Anderen Ordner wählen</button></div>`;
  if (state!=='live') { if (state==='connecting') html += `<div class="empty"><b>Daten werden geladen …</b></div>`; $('#title').textContent = 'wendekreis ERP'; $('#topact').innerHTML = ''; $('#view').innerHTML = html; return; }
  if (detail) { const r = byId(detail.col, detail.id); if (!r) { detail = null; return render(); } title = ENT[detail.col].title(r); act = `<button class="btn ghost" data-act="back">← ${ENT[detail.col].label}</button> <button class="btn" data-act="edit" data-col="${detail.col}" data-id="${r.id}">Bearbeiten</button>`; html += detail.col==='firmen' ? firmaDetail(r) : projektDetail(r); }
  else if (q && (view==='dashboard' || view==='einstellungen' || view==='pipeline')) { title = 'Suche'; html += searchView(q); }
  else if (view==='dashboard') { html += dashboard(); act = `<button class="btn" data-act="new" data-col="aktivitaeten">+ Notiz</button>`; }
  else if (view==='pipeline') { title = 'Pipeline'; act = `<button class="btn" data-act="new" data-col="chancen">+ Verkaufschance</button>`; html += pipeline(); }
  else if (view==='einstellungen') { title = 'Einstellungen'; html += settingsView(); }
  else if (ENT[view]) { title = ENT[view].label; act = `<button class="btn" data-act="new" data-col="${view}">+ ${ENT[view].one}</button>`; html += (view==='zeiten'?quickTime():'') + listView(view, q); }
  $('#title').textContent = title; $('#topact').innerHTML = act; $('#view').innerHTML = html;
}

function listView(col, q){
  const E = ENT[col];
  let rows = [...S[col]];
  if (filter && E.fkey) rows = rows.filter(r => E.fkey==='__rstatus' ? rStatus(r)===filter : E.fkey==='__done' ? (filter==='Erledigt' ? !!r.erledigt : !r.erledigt) : r[E.fkey]===filter);
  if (col==='angebote' && filter!=='Ersetzt') rows = rows.filter(r => r.status!=='Ersetzt');
  if (q) rows = rows.filter(r => E.cols.map(c => c[1](r)).join(' ').replace(/<[^>]+>/g,' ').toLowerCase().includes(q) || (r.notizen||'').toLowerCase().includes(q));
  rows.sort(E.sort);
  const fl = E.filters ? `<div class="filters" role="group" aria-label="Filter"><button data-act="filter" data-f="" aria-pressed="${!filter}">Alle</button>${E.filters.map(f=>`<button data-act="filter" data-f="${esc(f)}" aria-pressed="${filter===f}">${esc(f)}</button>`).join('')}</div>` : '';
  let sum = '';
  if (col==='rechnungen') { sum = `<span class="muted">${rows.length} Belege · offen ${eur(rows.reduce((a,r)=>a+offen(r),0))}</span>`; }
  if (col==='zeiten') { const h = rows.reduce((a,r)=>a+(Number(r.stunden)||0),0); sum = `<span class="muted">${num(h,2)} Std. = ${num(h/STD(),1)} PT</span>`; }
  if (col==='ausgaben') sum = `<span class="muted">Summe netto ${eur(rows.reduce((a,r)=>a+(Number(r.netto)||0),0))}</span>`;
  if (col==='chancen') sum = `<span class="muted">gewichtet ${eur(rows.filter(isOpen).reduce((a,c)=>a+(Number(c.volumen)||0)*(Number(c.wahrscheinlichkeit)||0)/100,0))}</span>`;
  const head = (fl||sum) ? `<div class="toolbar">${fl}<span class="sp"></span>${sum}</div>` : '';
  if (!S[col].length) return head + `<div class="empty"><b>Noch keine ${E.label}.</b>Lege den ersten Eintrag über „+ ${E.one}“ oben rechts an.</div>`;
  if (!rows.length) return head + `<div class="empty"><b>Keine Treffer.</b>Passe Suche oder Filter an.</div>`;
  return head + `<div class="tblwrap"><table class="tbl"><thead><tr>${E.cols.map(c=>`<th${c[2]?' class="r"':''}>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr data-act="open" data-col="${col}" data-id="${r.id}">${E.cols.map(c=>`<td${c[2]?' class="r"':''} data-label="${esc(c[0])}">${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function li(col, r, main, meta){ return `<li data-act="open" data-col="${col}" data-id="${r.id}"><span class="t">${main}</span><span class="m">${meta||''}</span></li>`; }
function sec(title, col, items, fn, preset, extra=''){
  return `<section class="card"><div class="card-h"><h3>${title}<span class="cnt">${items.length}</span></h3><span>${extra}${col?`<button class="btn ghost sm" data-act="new" data-col="${col}" data-preset="${esc(JSON.stringify(preset||{}))}">+ Neu</button>`:''}</span></div>${items.length?`<ul class="mini">${items.map(fn).join('')}</ul>`:'<p class="empty-s">Noch keine Einträge.</p>'}</section>`;
}

function dashboard(){
  const t = today(), y = t.slice(0,4), m = t.slice(0,7);
  const openCh = S.chancen.filter(isOpen);
  const weighted = openCh.reduce((a,c)=>a+(Number(c.volumen)||0)*(Number(c.wahrscheinlichkeit)||0)/100,0);
  const openR = S.rechnungen.filter(r=>offen(r)>0);
  const overdue = S.rechnungen.filter(r=>rStatus(r)==='Überfällig');
  const umsatz = S.rechnungen.filter(r=>umsatzRel(r) && (r.datum||'').startsWith(y)).reduce((a,r)=>a+tot(r).netto,0);
  const stdM = S.zeiten.filter(z=>(z.datum||'').startsWith(m)).reduce((a,z)=>a+(Number(z.stunden)||0),0);
  const unbilled = S.zeiten.filter(z=>z.abrechenbar!==false && !z.rechnungId);
  const unbilledVal = unbilled.reduce((a,z)=>{ const p=byId('projekte',z.projektId); return a+(Number(z.stunden)||0)/STD()*(Number(p&&p.tagessatz)||0); },0);
  const tasks = S.aufgaben.filter(a=>!a.erledigt && (!a.faellig || a.faellig<=addDays(t,7))).sort(ENT.aufgaben.sort);
  const soon = openCh.filter(c=>c.abschluss && c.abschluss<=addDays(t,45)).sort(ENT.chancen.sort);
  const acts = [...S.aktivitaeten].sort(ENT.aktivitaeten.sort).slice(0,6);
  const fristen = S.dokumente.filter(d=>d.gueltigBis && d.gueltigBis<=addDays(t,60)).sort((a,b)=>a.gueltigBis.localeCompare(b.gueltigBis));
  const kpi = (l,v,s) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  return `<div class="kpis">${kpi('Pipeline gewichtet',eur(weighted),`${openCh.length} offene Chancen · ungewichtet ${eur(openCh.reduce((a,c)=>a+(Number(c.volumen)||0),0))}`)}${kpi('Offene Rechnungen',eur(openR.reduce((a,r)=>a+offen(r),0)),overdue.length?`<span style="color:var(--crit);font-weight:600">${overdue.length} überfällig</span>`:`${openR.length} gestellt, keine überfällig`)}${kpi(`Umsatz ${y} netto`,eur(umsatz),'aus gestellten und bezahlten Rechnungen')}${kpi('Noch nicht abgerechnet',eur(unbilledVal),`${num(unbilled.reduce((a,z)=>a+(Number(z.stunden)||0),0),1)} Std. · diesen Monat ${num(stdM,1)} Std.`)}</div>
  <div class="grid2">
  ${sec('Aufgaben, fällig in 7 Tagen','aufgaben',tasks,a=>`<li data-act="open" data-col="aufgaben" data-id="${a.id}"><span class="t"><input type="checkbox" aria-label="Erledigt" data-act="toggle" data-id="${a.id}"> ${esc(a.titel)}${ex(a)}</span><span class="m"${a.faellig&&a.faellig<t?' style="color:var(--crit);font-weight:600"':''}>${fmtD(a.faellig)}</span></li>`)}
  ${sec('Abschlüsse in den nächsten 45 Tagen','chancen',soon,c=>li('chancen',c,`${esc(c.titel)}${ex(c)}<br><span class="muted">${esc(fname(c.firmaId))} · ${esc(c.phase||'Lead')}</span>`,`${eur(c.volumen)}<br>${fmtD(c.abschluss)}`))}
  ${sec('Offene Rechnungen',null,openR.sort((a,b)=>(a.faellig||'').localeCompare(b.faellig||'')),r=>li('rechnungen',r,`${esc(r.nummer)} · ${esc(fname(r.firmaId))}${ex(r)}`,`${eur(offen(r))}<br>${rStatus(r)==='Überfällig'?'<span style="color:var(--crit);font-weight:600">überfällig</span>':'fällig '+fmtD(r.faellig)}`))}
  ${sec('Letzte Aktivitäten','aktivitaeten',acts,a=>li('aktivitaeten',a,`<b>${esc(a.typ||'Notiz')}</b> · ${esc(fname(a.firmaId))}${ex(a)}<br><span class="muted">${esc((a.text||'').slice(0,90))}</span>`,fmtD(a.datum)))}
  ${fristen.length?sec('Vertragsfristen in 60 Tagen',null,fristen,d=>li('dokumente',d,`${esc(d.titel)} · ${esc(fname(d.firmaId))}`,fmtD(d.gueltigBis))):''}
  </div>`;
}

function searchView(q){
  let out = ''; let n = 0;
  COLS.forEach(col => {
    const E = ENT[col];
    const hits = S[col].filter(r => JSON.stringify(r).toLowerCase().includes(q) || E.title(r).toLowerCase().includes(q) || fname(r.firmaId).toLowerCase().includes(q)).slice(0,25);
    n += hits.length;
    if (hits.length) out += sec(E.label, null, hits, r => li(col, r, esc(E.title(r))+ex(r), esc(fname(r.firmaId))));
  });
  return n ? `<div class="grid2">${out}</div>` : `<div class="empty"><b>Keine Treffer für „${esc(q)}“.</b>Gesucht wird in allen Bereichen.</div>`;
}

function pipeline(){

  <div class="kpis" style="min-width:min(100%,420px)"><div class="kpi"><div class="l">Umsatz netto</div><div class="v">${eur(umsatz)}</div><div class="s">${re.length} Rechnungen</div></div><div class="kpi"><div class="l">Offene Pipeline</div><div class="v">${eur(ch.filter(isOpen).reduce((a,c)=>a+(Number(c.volumen)||0),0))}</div><div class="s">${ch.filter(isOpen).length} Chancen</div></div></div></div>

function LocalStore(d){
  return { kind:'local', label:`Ordner „${d.name}“`, ver:0,
    where(p){ return `${d.name}/${p}`; },
    async read(){ let fh; try { fh = await d.getFileHandle(FILE); } catch(e) { this.ver = 0; return null; } const f = await fh.getFile(); this.ver = f.lastModified; return await f.text(); },
    async write(text){
      const fh = await d.getFileHandle(FILE, {create:true}); const cur = await fh.getFile();
      if (this.ver && cur.lastModified > this.ver + 1000) throw {code:'conflict'};
      if (cur.size) await this.backup(cur);
      const w = await fh.createWritable(); await w.write(text); await w.close();
      this.ver = (await fh.getFile()).lastModified;
    },
    async backup(cur){
      const sub = await d.getDirectoryHandle('Sicherungen', {create:true}); const name = `wendekreis-erp-daten-${today()}.json`;
      try { await sub.getFileHandle(name); return; } catch(e) {}
      const w = await (await sub.getFileHandle(name, {create:true})).createWritable(); await w.write(await cur.text()); await w.close();
      const names = []; for await (const [n, h] of sub.entries()) if (h.kind === 'file' && /^wendekreis-erp-daten-\d{4}-\d{2}-\d{2}\.json$/.test(n)) names.push(n);
      names.sort(); while (names.length > 30) { try { await sub.removeEntry(names.shift()); } catch(e) { break; } }
    },
    async writeFile(subName, filename, data){
      let x = d; for (const part of subName.split('/')) x = await x.getDirectoryHandle(part, {create:true});

    },
    async changed(){ try { const f = await (await d.getFileHandle(FILE)).getFile(); return f.lastModified > this.ver + 1000; } catch(e) { return false; } }

}

    else if (ap && apk < 3 && ['[xx]','[x.xxx] €','[xx.xxx] €'][apk] === v) { v = [ap.menge, ap.preis, ap.betrag][apk]; apk++; if (apk === 3) ap = null; }

  const tp = `${A('ablageBasis')}/${A('angebotVorlage')}`;
  const r = await msApi(gPath(tp) + '?select=id,@microsoft.graph.downloadUrl');
  if (!r.ok) throw {code:'tpl', message:`Angebotsvorlage nicht gefunden (${tp}).`};
  const m = await r.json(); const dl = m['@microsoft.graph.downloadUrl'];
  const buf = await (dl ? fetch(dl, {cache:'no-store'}) : msApi(gPath(tp) + ':/content')).then(x => x.arrayBuffer());
  const zip = await window.JSZip.loadAsync(buf); const c = pptCtx(a);
  for (const name of Object.keys(zip.files).filter(n => /^ppt\/(slides\/slide|slideLayouts\/slideLayout|slideMasters\/slideMaster)\d+\.xml$/.test(n))) zip.file(name, fillSlide(await zip.file(name).async('string'), c));
  return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
}
let ablageLauf = false;
async function angebotAblage(id){
  if (!needGraph() || ablageLauf) return; ablageLauf = true;
  try {
    const a = byId('angebote', id); if (!a) return;
    const f = byId('firmen', a.firmaId); if (!f) { toast('Für die Ablage bitte dem Angebot eine Firma zuordnen.'); return; }
    toast('Kundenakte wird geprüft …');
    const akte = await ensureAkte(f);
    const vs = angVersions(a); const known = vs.find(v => v.ordner);
    const kurz = slug(a.kurztitel || String(a.titel||'').split(/\s+/).slice(0,4).join(' ')) || 'Angebot';
    const ordner = known ? known.ordner : `${akte}/${A('angeboteOrdner')}/${angStamm(a)}_${slug(f.name)}_${kurz}`;
    toast('Angebotsdokument wird erzeugt …');
    const blob = await buildPptx(a);
    const file = `${a.nummer}_${slug(f.name)}_${kurz}.pptx`;
    const r = await msApi(gPath(`${ordner}/${file}`) + ':/content', {method:'PUT', headers:{'Content-Type':'application/vnd.openxmlformats-officedocument.presentationml.presentation'}, body:blob});
    if (r.status === 423) throw {code:'net', message:'Die Datei ist gerade geöffnet. Bitte in PowerPoint schließen und erneut versuchen.'};
    if (!r.ok) throw {code:'net', message:`Hochladen fehlgeschlagen (HTTP ${r.status}).`};
    const j = await r.json().catch(() => ({}));
    const fo = await gGet(ordner).catch(() => null);
    await patch('angebote', a.id, {ordner, ordnerUrl: fo && fo.webUrl || '', dokument:{pfad:`${ordner}/${file}`, webUrl:j.webUrl||'', erstellt:new Date().toISOString()}});
    toast(`Abgelegt: ${file}`);
    if (editing && editing.col==='angebote' && editing.id===a.id) openForm('angebote', a.id);
  } catch(e) {
    if (e && e.code === 'auth') toast('Bitte erneut bei Microsoft anmelden.');
    else toast('Ablage nicht möglich: ' + (e && e.message || e));
  } finally { ablageLauf = false; }
}


/* ---------- Nr. 16: Pipeline automatisch nachziehen ---------- */
const ANG2PH = {Entwurf:'Angebot',Versendet:'Angebot',Angenommen:'Gewonnen',Abgelehnt:'Verloren',Abgelaufen:'Verloren'};
const PH2W = {Lead:10,'Erstgespräch':25,Angebot:50,Verhandlung:75,Gewonnen:100,Verloren:0};
function mkChance(d){ const now = new Date().toISOString(); const c = {...d, wahrscheinlichkeit:PH2W[d.phase], auto:true, createdAt:now, updatedAt:now, id:newId()}; S.chancen.push(c); return c; }
function syncPipeline(){
  if (state !== 'live' || !store) return 0;
  let n = 0, ch = false; const done = new Set();
  for (const a of S.angebote) {
    const st = angStamm(a); if (done.has(st)) continue; done.add(st);
    const vs = angVersions(a); const cur = vs.filter(x=>x.status!=='Ersetzt').pop() || vs[vs.length-1];
    let cid = (vs.find(x=>x.chanceId && byId('chancen',x.chanceId))||{}).chanceId;
    if (!cid) {
      const ph = ANG2PH[cur.status] || 'Angebot';
      const c = mkChance({titel:cur.titel||cur.kurztitel||cur.nummer, firmaId:cur.firmaId||'', kontaktId:cur.kontaktId||'', phase:ph, volumen:tot(cur).netto||null,
        abschluss: ph==='Angebot' ? (cur.gueltigBis||cur.datum||'') : (cur.datum||''), naechsterSchritt: ph==='Angebot' ? 'Angebot nachfassen' : '',
        notizen:`Automatisch nachgetragen aus Angebot ${cur.nummer||''} (${fmtD(today())}).`});
      cid = c.id; n++;
    }
    for (const v of vs) if (v.chanceId !== cid) { v.chanceId = cid; ch = true; }
  }
  for (const p of S.projekte) {
    const a = p.angebotId && byId('angebote', p.angebotId);
    let cid = (a && a.chanceId && byId('chancen',a.chanceId)) ? a.chanceId : (p.chanceId && byId('chancen',p.chanceId) ? p.chanceId : '');
    if (!cid) {
      const vol = Number(p.budgetEuro) || ((Number(p.tagessatz)||0)*(Number(p.budgetTage)||0)) || null;
      const c = mkChance({titel:p.name, firmaId:p.firmaId||'', kontaktId:'', phase:'Gewonnen', volumen:vol, abschluss:p.start||String(p.createdAt||'').slice(0,10)||today(),
        notizen:`Automatisch nachgetragen aus Projekt „${p.name||''}“ (${fmtD(today())}).`});
      cid = c.id; n++;
    }
    if (p.chanceId !== cid) { p.chanceId = cid; ch = true; }
    const c = byId('chancen', cid);
    if (c && isOpen(c)) { c.phase = 'Gewonnen'; c.wahrscheinlichkeit = 100; c.updatedAt = new Date().toISOString(); ch = true; }
  }
  if (n || ch) persist();
  if (n) toast(`Pipeline ergänzt: ${n} ${n===1?'Eintrag':'Einträge'} automatisch nachgetragen.`);
  return n;
}
/* ---------- flows ---------- */
async function ang2proj(a){
  const pt = (a.positionen||[]).filter(x=>x.einheit==='PT');
  const preset = {name:a.titel, firmaId:a.firmaId, angebotId:a.id, status:'Geplant', abrechnung: pt.length ? 'Nach Aufwand' : 'Festpreis', tagessatz: pt.length ? Number(pt[0].preis)||null : (Number(SET.tagessatz)||null), budgetTage: pt.reduce((s,x)=>s+(Number(x.menge)||0),0)||null, budgetEuro: tot(a).netto||null, start: a.projektStart || today(), ende: a.projektEnde || ''};
  openForm('projekte', null, preset, async (pid) => {
    await patch('angebote', a.id, {status:'Angenommen'});
    if (a.chanceId && byId('chancen',a.chanceId)) await patch('chancen', a.chanceId, {phase:'Gewonnen', wahrscheinlichkeit:100});
    if (a.firmaId) { const f = byId('firmen',a.firmaId); if (f && f.typ==='Interessent') await patch('firmen', f.id, {typ:'Kunde'}); }
    detail = {col:'projekte', id:pid}; view='projekte';
  });
}
function ang2rech(a){
  const p = S.projekte.find(x=>x.angebotId===a.id);
  openForm('rechnungen', null, {titel:a.titel, firmaId:a.firmaId, kontaktId:a.kontaktId, projektId:p?p.id:'', sprache:a.sprache||'DE', positionen:clone(a.positionen||[]), ustSatz:a.ustSatz??19});
}
function ch2ang(c){
  openForm('angebote', null, {titel:c.titel, kurztitel:c.titel, firmaId:c.firmaId, kontaktId:c.kontaktId, chanceId:c.id, positionen:[{text:'Beratungsleistung',menge:Number(SET.tagessatz)&&c.volumen?Math.round(c.volumen/Number(SET.tagessatz)):1,einheit:'PT',preis:Number(SET.tagessatz)||0}]},
    async () => { if (['Lead','Erstgespräch'].includes(c.phase||'Lead')) await patch('chancen', c.id, {phase:'Angebot'}); });
}
function proj2rech(p){
  const z = S.zeiten.filter(x=>x.projektId===p.id && x.abrechenbar!==false && !x.rechnungId).sort((a,b)=>(a.datum||'').localeCompare(b.datum||''));
  const au = S.ausgaben.filter(x=>x.projektId===p.id && x.weiterberechnen && !x.rechnungId);
  const std = z.reduce((a,x)=>a+(Number(x.stunden)||0),0);
  const von = z.length ? z[0].datum : '', bis = z.length ? z[z.length-1].datum : '';
  const f = byId('firmen',p.firmaId); const en = f && f.sprache==='EN';
  const pos = [];
  if (z.length) pos.push({text:`${en?'Consulting services':'Beratungsleistung'} ${p.name}\n${fmtD(von)} – ${fmtD(bis)}${en?'':' gemäß Leistungsnachweis'}`, ...(std % STD() === 0 ? {menge:std/STD(), einheit:'PT', preis:Number(p.tagessatz)||Number(SET.tagessatz)||0} : {menge:std, einheit:'Std', preis:Math.round((Number(p.tagessatz)||Number(SET.tagessatz)||0)/STD()*100)/100})});
  au.forEach(x=>pos.push({text:`${en?'Expenses':'Auslagen'}: ${x.kategorie?x.kategorie+' – ':''}${x.lieferant}${x.beschreibung?' ('+x.beschreibung+')':''}, ${fmtD(x.datum)}`, menge:1, einheit:'Pauschal', preis:Number(x.netto)||0}));
  openForm('rechnungen', null, {titel:p.name, firmaId:p.firmaId, projektId:p.id, leistungVon:von, leistungBis:bis, positionen:pos, sprache:en?'EN':'DE'}, async (rid) => {
    for (const x of z) await patch('zeiten', x.id, {rechnungId:rid});
    for (const x of au) await patch('ausgaben', x.id, {rechnungId:rid});
    toast(`${z.length} Zeiten und ${au.length} Auslagen als abgerechnet markiert`);
  });
}

/* ---------- export / import ---------- */
function exportJSON(){
  const out = {app:'wendekreis ERP', version:1, exportiert:new Date().toISOString(), einstellungen:SET, daten:{}};
  COLS.forEach(c => out.daten[c] = S[c].map(r=>clone(r)));
  save_(`wendekreis-erp-export-${today()}.json`, JSON.stringify(out, null, 2));
}
function exportCSV(col){
  const rows = S[col]; const keys = ['id', ...ENT[col].fields.map(f=>f.k), 'rechnungId','createdAt','updatedAt'].filter((k,i,a)=>a.indexOf(k)===i && (k!=='rechnungId' || rows.some(r=>r.rechnungId)));
  const cell = v => { if (v==null) return ''; if (typeof v==='object') v = JSON.stringify(v); v = String(v); if (typeof v==='string' && /^-?\d+(\.\d+)?$/.test(v)) v = v.replace('.',','); return /[;"\n\r]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
  const hdr = keys.map(k => { const f = ENT[col].fields.find(x=>x.k===k); return cell(f ? f.l : k); }).join(';');
  const body = rows.map(r => keys.map(k => { let v = r[k]; if (k.endsWith('Id') && k!=='id' && v) { const refCol = {firmaId:'firmen',kontaktId:'kontakte',chanceId:'chancen',angebotId:'angebote',projektId:'projekte',rechnungId:'rechnungen'}[k]; const t = refCol && byId(refCol,v); if (t) v = ENT[refCol].title(t); } return cell(v); }).join(';')).join('\r\n');
  save_(`wendekreis-${col}-${today()}.csv`, '﻿'+hdr+'\r\n'+body);
}
async function importJSON(file){
  let data; try { data = JSON.parse(await file.text()); } catch(e){ toast('Die Datei ist kein gültiger Export.'); return; }
  if (!data || !data.daten) { toast('Die Datei ist kein wendekreis-ERP-Export.'); return; }
  if (!ready()) return;
  let n = 0;
  for (const c of COLS) for (const r of (data.daten[c]||[])) { if (!r || !r.id) continue; const i = S[c].findIndex(x => x.id === r.id); if (i >= 0) S[c][i] = clone(r); else S[c].push(clone(r)); n++; }
  if (data.einstellungen) SET = {...SET, ...data.einstellungen};
  persist(); toast(`${n} Datensätze eingelesen`);
}
async function deleteExamples(){
  let n = 0; for (const c of COLS) { n += S[c].filter(x=>x.beispiel).length; S[c] = S[c].filter(x=>!x.beispiel); } persist();
  toast(`${n} Beispieldatensätze gelöscht`);
}
